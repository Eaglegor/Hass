blueprint:
  name: Presence Lighting
  description: >
    Turns on a group of lights when an "acquire" presence sensor detects
    presence, and turns them off when a "release" presence sensor stops
    detecting presence. Optionally, also turns the lights on when a door
    sensor opens.
  domain: automation
  input:
    acquire_sensor:
      name: Acquire Sensor
      description: Presence/motion sensor that turns the lights on when it becomes active.
      selector:
        entity:
          domain: binary_sensor
          device_class:
            - occupancy
            - motion
            - presence
    release_sensor:
      name: Release Sensor
      description: Presence/motion sensor that turns the lights off when it becomes inactive.
      selector:
        entity:
          domain: binary_sensor
          device_class:
            - occupancy
            - motion
            - presence
    door_sensor:
      name: Door Sensor (optional)
      description: >
        Optional door/window/opening contact sensor (e.g. an Aqara sensor
        such as lumi.magnet.agl02). If set, opening it also turns the
        lights on (independent of the presence sensors). Not filtered by
        device class, since contact sensors aren't always classified as
        door/window/opening.
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true
    lights:
      name: Lights
      description: The lights (entities, devices, or areas) to control as a group.
      selector:
        target:
          entity:
            domain: light

mode: restart

trigger:
  - platform: state
    entity_id: !input acquire_sensor
    to: "on"
    id: acquire
  - platform: state
    entity_id: !input release_sensor
    to: "off"
    id: release
  - platform: state
    entity_id: !input door_sensor
    to: "on"
    id: door

action:
  - choose:
      - conditions:
          - condition: trigger
            id:
              - acquire
              - door
        sequence:
          - service: light.turn_on
            target: !input lights
      - conditions:
          - condition: trigger
            id: release
        sequence:
          - service: light.turn_off
            target: !input lights
