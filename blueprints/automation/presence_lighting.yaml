blueprint:
  name: Presence Lighting
  description: >
    Turns on a group of lights when any "acquire" presence sensor detects
    presence, and turns them off when a "release" presence sensor stops
    detecting presence and *all* release sensors are then clear. Optionally,
    also turns the lights on when a door/window sensor opens.
  domain: automation
  input:
    acquire_sensors:
      name: Acquire Sensors
      description: >
        One or more presence/motion sensors. The lights turn on as soon as
        any one of them becomes active.
      selector:
        entity:
          domain: binary_sensor
          device_class:
            - occupancy
            - motion
            - presence
          multiple: true
    release_sensors:
      name: Release Sensors
      description: >
        One or more presence/motion sensors. The lights turn off once one
        of them becomes inactive, provided all release sensors are inactive
        at that point (i.e. nothing is still detecting presence).
      selector:
        entity:
          domain: binary_sensor
          device_class:
            - occupancy
            - motion
            - presence
          multiple: true
    door_sensor:
      name: Door Sensor (optional)
      description: >
        Optional door/window/opening contact sensor (e.g. an Aqara sensor
        such as lumi.magnet.agl02). If set, opening it also turns the
        lights on (independent of the presence sensors). Not filtered by
        device class, since contact sensors aren't always classified as
        door/window/opening.
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true
    lights:
      name: Lights
      description: The lights (entities, devices, or areas) to control as a group.
      selector:
        target:
          entity:
            domain: light

mode: restart

trigger:
  - platform: state
    entity_id: !input acquire_sensors
    to: "on"
    id: acquire
  - platform: state
    entity_id: !input release_sensors
    to: "off"
    id: release
  - platform: state
    entity_id: !input door_sensor
    to: "on"
    id: door

action:
  - choose:
      - conditions:
          - condition: trigger
            id:
              - acquire
              - door
        sequence:
          - service: light.turn_on
            target: !input lights
      - conditions:
          - condition: trigger
            id: release
          - condition: state
            entity_id: !input release_sensors
            state: "off"
        sequence:
          - service: light.turn_off
            target: !input lights
