blueprint:
  name: Matrix Clock Message (AWTRIX3)
  description: >
    An Assist/LLM tool script that displays a short array of messages in
    sequence on one specific AWTRIX3 matrix clock over MQTT (publishes to
    "<prefix>/notify", where <prefix> is read from the clock's own
    "Device topic" sensor). Instantiate this once per clock -- e.g. once
    per voice assistant satellite paired 1:1 with its own clock -- then,
    on the generated script, use Settings > Voice Assistants > Expose to
    expose it only to that satellite's own conversation agent so its LLM
    can call it as a tool after answering.

    IMPORTANT: after creating the script, also open its own Description
    field (Script Editor > settings/info, next to the name -- not the
    blueprint's input form) and paste in the same text hardcoded below as
    this blueprint's script description. Home Assistant does not copy a
    blueprint's internal description into the generated script's own
    entity description automatically, and it's that entity-level
    description the LLM tool exposure actually reads -- left blank, the
    LLM gets no explanation of what the tool does or when to call it.
  domain: script
  input:
    device_topic_sensor:
      name: Device Topic Sensor
      description: >
        This clock's "Device topic" sensor entity, created automatically
        by the AWTRIX3 MQTT device (shown on its device page under
        Sensors, e.g. "awtrix_clock_1"). Its state is read at call time to
        build the "<prefix>/notify" publish topic, so it stays correct
        even if the device's topic ever changes.
      selector:
        entity:
          domain: sensor
    repeat_count:
      name: Repeat Count
      description: >
        How many times each message repeats on screen (AWTRIX3's native
        "repeat" field), instead of an explicit display duration.
      default: 1
      selector:
        number:
          min: 1
          max: 10
          step: 1
          mode: box
    message_delay:
      name: Delay Between Messages (seconds)
      description: How long to wait after one queued message before sending the next.
      default: 3
      selector:
        number:
          min: 1
          max: 30
          step: 1
          unit_of_measurement: s
          mode: box
    first_message_stacking:
      name: First Message Stacking
      description: >
        Whether the first message of a call stacks on top of whatever is
        currently showing instead of replacing it. Every message after
        the first always stacks, regardless of this setting.
      default: false
      selector:
        boolean: {}

description: >
  This is a script to show short array of messages supporting answers on
  matrix clock. Display short factual information: numbers, names, dates,
  definitions etc.

  If you display enumeration, put each entry into different array item.
  Keep each item under 30 characters.

fields:
  messages:
    name: Messages
    description: >
      Array of short factual messages to display in sequence, one at a
      time (each under 30 characters).
    required: true
    example: '["16-18 °C", "Cloudy"]'
    selector:
      text:
        multiple: true

mode: restart

sequence:
  - variables:
      device_topic_sensor: !input device_topic_sensor
      mqtt_topic_prefix: "{{ states(device_topic_sensor) }}"
      repeat_count: !input repeat_count
      message_delay: !input message_delay
      first_message_stacking: !input first_message_stacking
  - repeat:
      for_each: "{{ messages }}"
      sequence:
        - variables:
            msg: "{{ repeat.item | replace('—', '-') | replace('–', '-') }}"
            msg_stack: "{{ first_message_stacking if repeat.first else true }}"
        - service: mqtt.publish
          data:
            topic: "{{ mqtt_topic_prefix }}/notify"
            payload: >
              {{ {'text': msg, 'repeat': repeat_count, 'stack': msg_stack} | to_json }}
        - if:
            - condition: template
              value_template: "{{ not repeat.last }}"
          then:
            - delay:
                seconds: "{{ message_delay }}"
