services:
  homeassistant:
    image: homeassistant/home-assistant:stable
    container_name: hass-core
    restart: unless-stopped
    # Host networking is Home Assistant's own recommendation for the Container
    # install method — it's what lets mDNS-based discovery (Wyoming, ESPHome,
    # HA Voice PE devices) find this box without extra port juggling.
    network_mode: host
    # Lets HA's Bluetooth integration talk to the host's BlueZ over D-Bus, plus
    # the raw HCI socket access some backends need. Without these it fails
    # with "DBus service not found" and never actually scans.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # USB Zigbee/Z-Wave dongle passthrough. network_mode: host does NOT grant
    # device access on its own -- that's a separate namespace, and without an
    # explicit mapping ZHA/zwave_js can't open the serial port at all (shows up
    # as a vague "was not able to automatically detect serial port settings"
    # error, not an obvious permissions/missing-device one).
    # /dev/ttyUSB0 is passed through directly since Docker's `devices:` needs a
    # real device node, not a symlink; the /dev/serial/by-id bind mount below
    # makes the *stable* identifier available inside the container too, so ZHA
    # can be configured against that instead of the (occasionally
    # renumberable) /dev/ttyUSBn path directly.
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    volumes:
      - ./config/homeassistant:/config
      - /run/dbus:/run/dbus:ro
      - /dev/serial/by-id:/dev/serial/by-id
    environment:
      - TZ=${TZ:-Etc/UTC}

  stt:
    image: rhasspy/wyoming-vosk:latest
    container_name: hass-stt
    restart: unless-stopped
    # Flags confirmed against `docker run --rm rhasspy/wyoming-vosk --help`.
    # There is no plain --model flag — --model-for-language takes two values
    # (language, then model name), and --preload-language loads it at startup
    # instead of lazily on the first request.
    # --sentences-dir is required whenever --preload-language is used: the
    # upstream code calls load_sentences_for_language() unconditionally during
    # preload and crashes on a None path if it's omitted, even though we don't
    # use sentence correction/limiting. The directory doesn't need to contain
    # anything — a missing "<language>.yaml" inside it is handled gracefully.
    command: >
      --uri tcp://0.0.0.0:10300
      --data-dir /data
      --download-dir /data
      --sentences-dir /data/sentences
      --language ${VOSK_LANGUAGE:-ru}
      --preload-language ${VOSK_LANGUAGE:-ru}
      --model-for-language ${VOSK_LANGUAGE:-ru} ${VOSK_MODEL:-vosk-model-small-ru-0.22}
    ports:
      - "10300:10300"
    volumes:
      - ./data/vosk:/data

  matter-server:
    # General smart-home infra, unrelated to the voice pipeline: HA's built-in
    # Matter integration is just a thin WebSocket client -- it doesn't bundle
    # an actual Matter server, so this is a separate required service.
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    container_name: hass-matter-server
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined
    # Matter relies heavily on mDNS/multicast for device discovery, which
    # doesn't work reliably through Docker's default bridge networking --
    # same reasoning as homeassistant's network_mode: host above.
    network_mode: host
    # --primary-interface is required, not optional: on a host that also runs
    # other Docker containers (like stt/tts here), matter-server's own
    # auto-detection can latch onto one of THEIR bridge networks (e.g.
    # br-xxxxxxxx) instead of the real LAN/WiFi uplink, which breaks mDNS
    # advertisement ("Network is unreachable") without an obvious error
    # pointing at the cause. The ${VAR:?...} form fails docker compose up
    # immediately with a clear message if MATTER_PRIMARY_INTERFACE isn't set,
    # rather than starting and silently picking the wrong interface.
    command: --storage-path /data --primary-interface ${MATTER_PRIMARY_INTERFACE:?Set MATTER_PRIMARY_INTERFACE in .env to your real network interface name -- run 'ip link show' on the host and pick the real LAN/WiFi one, not a docker0/br-.../veth... interface}
    volumes:
      - ./data/matter-server:/data
      - /run/dbus:/run/dbus:ro

  tts:
    # Built directly from the add-on's own repo (git build context, no local
    # vendoring of their code) — the underlying container is a plain
    # FastAPI/Uvicorn app with no Supervisor dependency, even though the repo
    # is packaged as a Home Assistant OS add-on. Paired with the
    # indevor/silero-tts-enhanced-hacs custom integration on the HA side
    # (installed via HACS, not covered by this compose file) — see README.
    build:
      context: https://github.com/indevor/silero-tts-enhanced-addon.git#main:silero_tts_enhanced_addon
    container_name: hass-tts
    restart: unless-stopped
    ports:
      - "8014:8014"
    volumes:
      # Model cache — the app looks for /data itself and persists here if
      # present, falling back to an ephemeral in-container path otherwise.
      - ./data/silero:/data
